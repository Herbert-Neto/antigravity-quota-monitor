name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: go build -trimpath -ldflags="-H=windowsgui -s -w" -o agy-quota.exe .

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: go build -trimpath -ldflags="-s -w" -o agy-quota .
