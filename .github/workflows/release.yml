name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GOOS: windows
      GOARCH: amd64
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Compile tests
        run: go test -c -o /dev/null ./...

      - name: Build Windows binary
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/agy-quota.exe .
          sha256sum dist/agy-quota.exe > dist/agy-quota.exe.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/agy-quota.exe
            dist/agy-quota.exe.sha256
