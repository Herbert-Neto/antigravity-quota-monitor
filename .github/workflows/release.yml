name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: |
          go vet ./...
          GOOS=windows GOARCH=amd64 go vet ./...
          GOOS=darwin GOARCH=arm64 go vet ./...

      - name: Test
        run: go test -v ./...

      - name: Build binaries (Windows, Linux, macOS)
        run: |
          mkdir -p dist

          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-H=windowsgui -s -w" -o dist/agy-quota-windows-amd64.exe .

          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agy-quota-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/agy-quota-linux-arm64 .

          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/agy-quota-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/agy-quota-darwin-arm64 .

          (
            cd dist
            sha256sum agy-quota-windows-amd64.exe agy-quota-linux-amd64 agy-quota-linux-arm64 agy-quota-darwin-amd64 agy-quota-darwin-arm64 > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
